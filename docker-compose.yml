services:
  api-gateway-service:
    build: ./api-gateway-service
    container_name: restaurant-api-gateway
    restart: on-failure
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      reservation-service:
        condition: service_started
      menu-service:
        condition: service_started
      loyalty-service:
        condition: service_started
      reservation-aggregator-service:
        condition: service_started

  reservation-aggregator-service:
    build: ./reservation-aggregator-service
    container_name: restaurant-reservation-aggregator-service
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      aggregator-db:
        condition: service_healthy
      reservation-service:
        condition: service_started
      menu-service:
        condition: service_started
      loyalty-service:
        condition: service_started

  reservation-service:
    build: ./reservation-service
    container_name: restaurant-reservation-service
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      reservation-db:
        condition: service_healthy

  menu-service:
    build: ./menu-service
    container_name: restaurant-menu-service
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      menu-db:
        condition: service_healthy

  loyalty-service:
    build: ./loyalty-service
    container_name: restaurant-loyalty-service
    restart: on-failure
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      loyalty-db:
        condition: service_healthy

  reservation-db:
    image: mysql:8.0
    container_name: reservation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: reservation_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    volumes:
      - reservation-mysql-data:/var/lib/mysql

  menu-db:
    image: postgres:16
    container_name: menu-postgres
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menu_db"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    volumes:
      - menu-postgres-data:/var/lib/postgresql/data

  loyalty-db:
    image: mysql:8.0
    container_name: loyalty-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: loyalty_db
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    volumes:
      - loyalty-mysql-data:/var/lib/mysql

  aggregator-db:
    image: mongo:7
    container_name: reservation-aggregator-mongo
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    volumes:
      - aggregator-mongo-data:/data/db

volumes:
  reservation-mysql-data:
  menu-postgres-data:
  loyalty-mysql-data:
  aggregator-mongo-data:
