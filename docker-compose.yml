services:
  api-gateway-service:
    build: ./api-gateway-service
    container_name: restaurant-api-gateway
    ports:
      - "8080:8080"
    environment:
      RESERVATION_SERVICE_BASE_URL: http://reservation-service:8081
      MENU_SERVICE_BASE_URL: http://menu-service:8082
      LOYALTY_SERVICE_BASE_URL: http://loyalty-service:8083
    depends_on:
      reservation-service:
        condition: service_started
      menu-service:
        condition: service_started
      loyalty-service:
        condition: service_started

  reservation-service:
    build: ./reservation-service
    container_name: restaurant-reservation-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://reservation-db:3306/reservation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      reservation-db:
        condition: service_healthy

  menu-service:
    build: ./menu-service
    container_name: restaurant-menu-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://menu-db:5432/menu_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      menu-db:
        condition: service_healthy

  loyalty-service:
    build: ./loyalty-service
    container_name: restaurant-loyalty-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://loyalty-db:3306/loyalty_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      loyalty-db:
        condition: service_healthy

  reservation-db:
    image: mysql:8.0
    container_name: reservation-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: reservation_db
    ports:
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    volumes:
      - reservation-mysql-data:/var/lib/mysql

  menu-db:
    image: postgres:16
    container_name: menu-postgres
    environment:
      POSTGRES_DB: menu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d menu_db"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    volumes:
      - menu-postgres-data:/var/lib/postgresql/data

  loyalty-db:
    image: mysql:8.0
    container_name: loyalty-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: loyalty_db
    ports:
      - "3308:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 90s
    volumes:
      - loyalty-mysql-data:/var/lib/mysql

  mysql-admin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: restaurant-mysql-admin
    environment:
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      reservation-db:
        condition: service_healthy
      loyalty-db:
        condition: service_healthy

  db-adminer:
    image: adminer:latest
    container_name: restaurant-db-adminer
    ports:
      - "8082:8080"
    depends_on:
      menu-db:
        condition: service_healthy

volumes:
  reservation-mysql-data:
  menu-postgres-data:
  loyalty-mysql-data:
