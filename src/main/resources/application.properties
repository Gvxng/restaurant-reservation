# ============================================
# APPLICATION CONFIGURATION
# ============================================
spring.application.name=restaurant-reservation

# ============================================
# MYSQL DATABASE CONNECTION
# ============================================
# Connects to the 'mysql' Docker service defined in docker-compose.yml
spring.datasource.url=jdbc:mysql://mysql:3306/restaurant_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / HIBERNATE CONFIGURATION
# ============================================
# 'create' drops and recreates all tables on each startup using your @Entity classes
# Switch to 'validate' if you want to manage schema via init.sql only
spring.jpa.hibernate.ddl-auto=create

# Show SQL statements in console (useful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# IMPORTANT: Let Hibernate create tables first before running SQL seed script
spring.jpa.defer-datasource-initialization=true

# ============================================
# SQL SEED DATA
# ============================================
# Runs after Hibernate creates the schema
# Used to insert the 10+ sample rows per table
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:init.sql

# ============================================
# SERVER
# ============================================
server.port=8080

# ============================================
# ACTUATOR (used by Docker HEALTHCHECK)
# ============================================
# Exposes /actuator/health endpoint used in Dockerfile HEALTHCHECK
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ============================================
# LOGGING
# ============================================
logging.level.com.restaurant=DEBUG
