server:
  error:
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

spring:
  application:
    name: api-gateway-service

---
spring:
  config:
    activate:
      on-profile: default

server:
  port: 8080

microservices:
  reservation:
    base-url: http://localhost:8081
  menu:
    base-url: http://localhost:8082
  loyalty:
    base-url: http://localhost:8083

---
spring:
  config:
    activate:
      on-profile: docker

server:
  port: 8080

microservices:
  reservation:
    base-url: http://reservation-service:8081
  menu:
    base-url: http://menu-service:8082
  loyalty:
    base-url: http://loyalty-service:8083
